[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmind"
version = "0.1.0"
description = "Production-oriented, reusable Python workflow automation and orchestration library."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "FlowMind AI Maintainers", email = "maintainers@flowmind.ai"}
]
keywords = ["workflow", "orchestration", "dag", "automation", "ai", "reliability", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
ai = ["openai>=1.0.0", "anthropic>=0.18.0"]
ui = ["streamlit>=1.30.0"]
cli = ["click>=8.0.0", "rich>=13.0.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "black>=23.0.0", "ruff>=0.1.0"]

[project.scripts]
flowmind = "flowmind.cli.main:main"
